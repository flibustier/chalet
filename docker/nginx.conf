server {
    listen 8080;
    root /usr/share/nginx/html;

    gzip on;
    # Behind a reverse proxy too (Caddy, Traefik…), which is how it usually runs
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # File names in assets/ change with their content: they can be kept for good
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The page itself is checked each time, so an update shows up at once
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
